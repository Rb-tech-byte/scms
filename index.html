<!DOCTYPE html>
<!--
    Short Course Management System (SCMS)
    Author & Lead Developer: Renatus Bernardo
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Renatus Bernardo">
    <meta http-equiv="refresh" content="0; url=public/login">
    <title>Short Course Management System (SCMS)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f9;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .container {
            max-width: 28rem;
            text-align: center;
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(1, 59, 166, 0.1);
            border: 1px solid #d2eaf9;
        }
        h1 {
            color: #013ba6;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #4a515b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        a {
            display: inline-block;
            background-color: #013ba6;
            color: #ffffff;
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        a:hover {
            background-color: #228ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Short Course Management System</h1>
        <p>Redirecting to the login portal...</p>
        <a href="public/login">Continue to Login</a>
    </div>
</body>
</html>
